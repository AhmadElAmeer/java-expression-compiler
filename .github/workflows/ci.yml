name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run tests
        run: ./gradlew build --no-daemon
      - name: Differential fuzzing (interpreter vs VM vs optimized VM)
        run: ./gradlew run --no-daemon --args="fuzz 3000 1"
      - name: Run the examples
        run: |
          for f in fib primes collatz gcd constants; do
            ./gradlew run --no-daemon -q --args="run examples/$f.mini -O"
          done
